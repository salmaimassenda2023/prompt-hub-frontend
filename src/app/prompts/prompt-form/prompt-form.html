<p-card>

   <form  [formGroup]="promptForm" (ngSubmit)="onSubmit()" >
     
        <div class="field">
            <label for="title">Title</label>
            <input pInputText id="title" type="text" formControlName="title" />
        </div>
        
        <div class="field">
            <label for="content">Content</label>
            <textarea  id="content" rows="8" class="w-full mb-3" pTextarea formControlName="content"> </textarea>
        </div>

        <div class="field">
            <label for="category">Category</label>
            <p-select [options]="categories()" id="category" placeholder="Select a Category" class="w-full md:w-56"
             formControlName="categoryId" 
             optionLabel="name"
             optionValue="id" />

        </div>

        <div class="flex gap-2">
            <p-button severity="primary" label="submit" type="submit"  size="small" />
             <p-button severity="danger" label="cancel" (onClick)="onReset()" size="small" />
        </div>
        

        
        
    </form>

</p-card>
